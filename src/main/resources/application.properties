# ============================================================================
# Clínica Dental - configuración local
# Curso 8C003 Desarrollo de Aplicaciones Seguras
# ============================================================================

server.port=8080
spring.application.name=app-clinica-dental

# ----------------------------------------------------------------------------
# Base de datos
# ----------------------------------------------------------------------------
# createDatabaseIfNotExist=true permite que la aplicación cree la base
# clinica_dental si todavía no existe. Las tablas las crea Hibernate.
#
# useSSL=false es SOLO para el MySQL local del curso. En producción debe
# ir sobre TLS (useSSL=true) y con un usuario de base de datos de privilegios
# mínimos, no root.
#
# La contraseña de MySQL no se guarda en el proyecto. Defínela en la
# variable de entorno DB_PASSWORD antes de arrancar.
spring.datasource.url=jdbc:mysql://localhost:3306/clinica_dental?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / Hibernate
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# ----------------------------------------------------------------------------
# Thymeleaf
# ----------------------------------------------------------------------------
spring.thymeleaf.cache=false

# ----------------------------------------------------------------------------
# Errores y sesión
# ----------------------------------------------------------------------------
server.error.whitelabel.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ----------------------------------------------------------------------------
# CAPTCHA del registro
# ----------------------------------------------------------------------------
# Se activa por defecto. Para pruebas automatizadas se puede apagar con:
#   --app.captcha.habilitado=false
# En la entrega debe quedar en true.
app.captcha.habilitado=true
app.captcha.minutos-validez=5

# ----------------------------------------------------------------------------
# Logs
# ----------------------------------------------------------------------------
logging.level.pe.edu.idat.appclinica=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
