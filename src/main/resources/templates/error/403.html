<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso denegado')}"></head>
<body class="error-body">

<main class="error-card">
    <a class="brand brand-centro" th:href="@{/auth/login}" aria-label="Clínica Dental">
        <span class="brand-mark" aria-hidden="true">cd</span>
        <span class="brand-text">
            <strong>Clínica Dental</strong>
            <small>Agenda odontológica</small>
        </span>
    </a>

    <p class="error-code">403</p>
    <h1>No tienes acceso a esta página</h1>
    <p th:text="${mensaje != null ? mensaje : 'Tu cuenta no tiene permisos para esta sección.'}">Tu cuenta no tiene permisos para esta sección.</p>

    <div class="error-acciones">
        <a th:if="${usuarioActual != null}" class="boton boton-primario" th:href="@{/auth/home}">Volver al inicio</a>
        <a th:if="${usuarioActual == null}" class="boton boton-primario" th:href="@{/auth/login}">Iniciar sesión</a>
        <form th:if="${usuarioActual != null}" th:action="@{/logout}" method="post">
            <button type="submit" class="boton boton-fantasma">Cerrar sesión</button>
        </form>
    </div>
</main>

</body>
</html>
